<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Controls</title>
</head>
<body>
  <form>
    <div>
      <label>Name</label>
    <input type="text" name="name">
    </div>
    <div>
      <label>Email</label>
    <input type="email" email="email">
    </div>
    <div>
      <label>Color</label>
    <input type="color" color="color">
    </div>
     <div>
      <label>Size</label>
      <input type="value" size="size">
     </div>
     <button>Submit</button>
    
  </form>
  
</body>
</html>
